<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>妖怪メダル図鑑</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f5f9;
  color:#222;
}

header{
  background:#15171a;
  color:white;
  text-align:center;
  padding:28px 16px;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:8px 0 0;
  color:#bbb;
}

main{
  max-width:600px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

.camera{
  width:100%;
  aspect-ratio:1/1;
  background:#111;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  display:none;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.guide{
  position:absolute;
  width:70%;
  height:70%;
  left:15%;
  top:15%;
  border:3px solid white;
  border-radius:50%;
  box-shadow:0 0 0 999px rgba(0,0,0,.45);
}

button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  margin-top:10px;
  font-size:17px;
  font-weight:bold;
  background:#202124;
  color:white;
}

.secondary{
  background:#e8ebf0;
  color:#222;
}

.hidden{
  display:none!important;
}

.status{
  background:#eef3ff;
  padding:14px;
  border-radius:14px;
  margin-top:12px;
  line-height:1.5;
}

#photo{
  width:100%;
  border-radius:18px;
  margin-top:15px;
  display:none;
}

.result{
  text-align:center;
}

.result-icon{
  font-size:70px;
}

.result-name{
  font-size:28px;
  font-weight:800;
}

.medal{
  padding:15px;
  border:1px solid #ddd;
  border-radius:16px;
  margin-top:10px;
}

.medal-name{
  font-size:19px;
  font-weight:bold;
}

.medal-count{
  color:#666;
  margin-top:5px;
}

.progress{
  height:12px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#202124;
}
</style>
</head>

<body>

<header>
<h1>👻 妖怪メダル図鑑</h1>
<p>メダルを集めて図鑑を完成させよう</p>
</header>

<main>

<section class="card">

<h2>📷 メダルを撮影</h2>

<div id="camera" class="camera">

<video
id="video"
autoplay
playsinline
muted>
</video>

<div class="guide"></div>

</div>

<button id="startButton">
📷 カメラを起動
</button>

<button id="captureButton" class="hidden">
🪙 メダルを撮影
</button>

<button id="stopButton" class="secondary hidden">
カメラを閉じる
</button>

<div id="status" class="status">
メダルを枠の中に入れてください。
</div>

<img id="photo">

</section>


<section id="resultCard" class="card hidden">

<div class="result">

<div class="result-icon">👻</div>

<div id="resultName" class="result-name">
妖怪
</div>

<p id="resultMessage">
メダルを発見しました！
</p>

</div>

</section>


<section class="card">

<h2>📖 妖怪図鑑</h2>

<div id="collection"></div>

</section>


<section class="card">

<h2>📊 コレクション</h2>

<div id="progressText">
0 / 5 種類発見
</div>

<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>

</section>

</main>


<script>

let stream=null;


/* 妖怪データ */

const yokai=[

{
id:"jibanyan",
name:"ジバニャン"
},

{
id:"komasan",
name:"コマさん"
},

{
id:"komajiro",
name:"コマじろう"
},

{
id:"whisper",
name:"ウィスパー"
},

{
id:"shogunyan",
name:"ブシニャン"
}

];


/* 所持データ */

let collection=
JSON.parse(
localStorage.getItem(
"youkai_collection"
)||"{}"
);


/* HTML */

const video=
document.getElementById("video");

const camera=
document.getElementById("camera");

const startButton=
document.getElementById("startButton");

const captureButton=
document.getElementById("captureButton");

const stopButton=
document.getElementById("stopButton");

const status=
document.getElementById("status");

const photo=
document.getElementById("photo");

const resultCard=
document.getElementById("resultCard");

const resultName=
document.getElementById("resultName");

const resultMessage=
document.getElementById("resultMessage");

const collectionElement=
document.getElementById("collection");

const progressText=
document.getElementById("progressText");

const progressBar=
document.getElementById("progressBar");


/* カメラ */

async function startCamera(){

try{

stream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"environment"
},

audio:false

});

video.srcObject=stream;

camera.style.display="block";

startButton.classList.add("hidden");

captureButton.classList.remove("hidden");

stopButton.classList.remove("hidden");

status.textContent=
"📷 メダルを枠の中に入れてください。";

}catch(error){

status.textContent=
"カメラを起動できませんでした。";

}

}


/* カメラ停止 */

function stopCamera(){

if(stream){

stream
.getTracks()
.forEach(track=>track.stop());

}

stream=null;

video.srcObject=null;

camera.style.display="none";

startButton.classList.remove("hidden");

captureButton.classList.add("hidden");

stopButton.classList.add("hidden");

}


/* 写真撮影 */

function captureMedal(){

if(!video.videoWidth){

status.textContent=
"カメラの準備ができていません。";

return;

}


/* Canvasに写真をコピー */

const canvas=
document.createElement("canvas");

canvas.width=video.videoWidth;

canvas.height=video.videoHeight;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);


/* 撮影した画像を表示 */

photo.src=
canvas.toDataURL("image/jpeg",0.9);

photo.style.display="block";


status.textContent=
"📸 メダルを撮影しました！";


/*
次の段階で、この画像をAIに渡して
妖怪を判定する。
*/


setTimeout(()=>{

const result=
yokai[0];

discover(result);

},800);

}


/* 発見 */

function discover(medal){

collection[medal.id]=
(collection[medal.id]||0)+1;

localStorage.setItem(
"youkai_collection",
JSON.stringify(collection)
);

resultCard.classList.remove("hidden");

resultName.textContent=
medal.name;

resultMessage.textContent=
"✨ "+medal.name+"を発見！";

status.textContent=
"🎉 図鑑に登録しました！";

renderCollection();

}


/* 図鑑 */

function renderCollection(){

collectionElement.innerHTML="";

let discovered=0;

yokai.forEach(medal=>{

const count=
collection[medal.id]||0;

if(count>0){

discovered++;

collectionElement.innerHTML+=`

<div class="medal">

<div class="medal-name">
👻 ${medal.name}
</div>

<div class="medal-count">
所持枚数：${count}枚
</div>

</div>

`;

}

});


if(discovered===0){

collectionElement.innerHTML=
"<p>まだ妖怪を発見していません。</p>";

}


progressText.textContent=
discovered+" / "+yokai.length+" 種類発見";

progressBar.style.width=
(discovered/yokai.length*100)+"%";

}


/* ボタン */

startButton.onclick=startCamera;

captureButton.onclick=captureMedal;

stopButton.onclick=stopCamera;


/* 初期化 */

renderCollection();

</script>

</body>
</html>
