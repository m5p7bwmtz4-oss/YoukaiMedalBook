<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>妖怪メダル図鑑</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f3f5f9;
  color:#222;
}

header{
  background:#15171a;
  color:white;
  text-align:center;
  padding:28px 16px;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:8px 0 0;
  color:#bbb;
}

main{
  max-width:600px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 5px 20px rgba(0,0,0,.07);
}

h2{
  margin-top:0;
}

.camera{
  width:100%;
  aspect-ratio:1/1;
  background:#111;
  border-radius:18px;
  overflow:hidden;
  position:relative;
  display:none;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.guide{
  position:absolute;
  width:70%;
  height:70%;
  left:15%;
  top:15%;
  border:3px solid white;
  border-radius:50%;
  box-shadow:0 0 0 999px rgba(0,0,0,.45);
}

button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  margin-top:10px;
  font-size:17px;
  font-weight:bold;
  background:#202124;
  color:white;
}

button:active{
  transform:scale(.98);
}

.secondary{
  background:#e8ebf0;
  color:#222;
}

.hidden{
  display:none!important;
}

.status{
  background:#eef3ff;
  padding:14px;
  border-radius:14px;
  margin-top:12px;
  line-height:1.5;
}

.result{
  text-align:center;
}

.result-icon{
  font-size:70px;
}

.result-name{
  font-size:28px;
  font-weight:800;
  margin:8px 0;
}

.medal{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  border:1px solid #e2e5e9;
  border-radius:16px;
  margin-top:10px;
}

.medal-icon{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.medal-name{
  font-size:18px;
  font-weight:bold;
}

.medal-count{
  color:#666;
  margin-top:4px;
}

.progress{
  height:12px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#202124;
  transition:.3s;
}

.empty{
  color:#777;
  text-align:center;
  padding:15px;
}

.note{
  font-size:13px;
  color:#777;
  line-height:1.6;
}
</style>
</head>

<body>

<header>
  <h1>👻 妖怪メダル図鑑</h1>
  <p>メダルを集めて図鑑を完成させよう</p>
</header>

<main>

  <!-- カメラ -->
  <section class="card">

    <h2>📷 メダルを発見</h2>

    <div id="camera" class="camera">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>

      <div class="guide"></div>

    </div>

    <button id="startButton">
      📷 カメラを起動
    </button>

    <button id="captureButton" class="hidden">
      🪙 メダルを撮影
    </button>

    <button id="stopButton" class="secondary hidden">
      カメラを閉じる
    </button>

    <div id="status" class="status">
      メダルをカメラの中央に入れてください。
    </div>

  </section>


  <!-- 認識結果 -->

  <section id="resultCard" class="card hidden">

    <div class="result">

      <div class="result-icon">
        👻
      </div>

      <div id="resultName" class="result-name">
        妖怪
      </div>

      <p id="resultMessage">
        メダルを発見しました！
      </p>

    </div>

  </section>


  <!-- 図鑑 -->

  <section class="card">

    <h2>📖 妖怪図鑑</h2>

    <div id="collection"></div>

  </section>


  <!-- コレクション -->

  <section class="card">

    <h2>📊 コレクション</h2>

    <div id="progressText">
      0 / 5 種類発見
    </div>

    <div class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>

  </section>


  <section class="card">

    <p class="note">
      ※現在はカメラ機能を作る第1版です。
      次の段階でメダルの画像をAIで認識できるようにします。
    </p>

  </section>

</main>


<script>

let stream = null;


/*
  妖怪データ
  今後ここにどんどん追加する
*/

const yokai = [

  {
    id:"jibanyan",
    name:"ジバニャン"
  },

  {
    id:"komasan",
    name:"コマさん"
  },

  {
    id:"komajiro",
    name:"コマじろう"
  },

  {
    id:"whisper",
    name:"ウィスパー"
  },

  {
    id:"shogunyan",
    name:"ブシニャン"
  }

];


/*
  所持データ
*/

let collection =
  JSON.parse(
    localStorage.getItem(
      "youkai_medal_collection"
    ) || "{}"
  );


const video =
  document.getElementById("video");

const camera =
  document.getElementById("camera");

const startButton =
  document.getElementById("startButton");

const captureButton =
  document.getElementById("captureButton");

const stopButton =
  document.getElementById("stopButton");

const status =
  document.getElementById("status");

const resultCard =
  document.getElementById("resultCard");

const resultName =
  document.getElementById("resultName");

const resultMessage =
  document.getElementById("resultMessage");

const collectionElement =
  document.getElementById("collection");

const progressText =
  document.getElementById("progressText");

const progressBar =
  document.getElementById("progressBar");


/*
  カメラを起動
*/

async function startCamera(){

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:{
            ideal:"environment"
          }
        },

        audio:false

      });

    video.srcObject = stream;

    camera.style.display = "block";

    startButton.classList.add("hidden");

    captureButton.classList.remove("hidden");

    stopButton.classList.remove("hidden");

    status.textContent =
      "📷 メダルを枠の中に入れてください。";

  }

  catch(error){

    status.textContent =
      "カメラを起動できませんでした。カメラの許可を確認してください。";

  }

}


/*
  カメラを停止
*/

function stopCamera(){

  if(stream){

    stream
      .getTracks()
      .forEach(track => track.stop());

  }

  stream = null;

  video.srcObject = null;

  camera.style.display = "none";

  startButton.classList.remove("hidden");

  captureButton.classList.add("hidden");

  stopButton.classList.add("hidden");

}


/*
  撮影
*/

function captureMedal(){

  status.textContent =
    "🔍 メダルを解析しています…";

  captureButton.disabled = true;

  /*
    現段階ではテスト認識。
    次のアップデートでここを
    本物の画像認識AIに変更する。
  */

  setTimeout(function(){

    const result =
      yokai[
        Math.floor(
          Math.random() * yokai.length
        )
      ];

    discover(result);

    captureButton.disabled = false;

  },1000);

}


/*
  妖怪を発見
*/

function discover(medal){

  collection[medal.id] =
    (collection[medal.id] || 0) + 1;

  localStorage.setItem(
    "youkai_medal_collection",
    JSON.stringify(collection)
  );

  resultCard.classList.remove("hidden");

  resultName.textContent =
    medal.name;

  resultMessage.textContent =
    "✨ " +
    medal.name +
    "を発見！";

  status.textContent =
    "🎉 図鑑に登録しました！";

  renderCollection();

}


/*
  図鑑を表示
*/

function renderCollection(){

  collectionElement.innerHTML = "";

  let discovered = 0;

  yokai.forEach(function(medal){

    const count =
      collection[medal.id] || 0;

    if(count > 0){

      discovered++;

      collectionElement.innerHTML += `

        <div class="medal">

          <div class="medal-icon">
            👻
          </div>

          <div>

            <div class="medal-name">
              ${medal.name}
            </div>

            <div class="medal-count">
              所持枚数：${count}枚
            </div>

          </div>

        </div>

      `;

    }

  });


  if(discovered === 0){

    collectionElement.innerHTML = `
      <div class="empty">
        まだ妖怪を発見していません。
      </div>
    `;

  }


  progressText.textContent =
    discovered +
    " / " +
    yokai.length +
    " 種類発見";


  const percent =
    (discovered / yokai.length) * 100;

  progressBar.style.width =
    percent + "%";

}


/*
  ボタン
*/

startButton.onclick =
  startCamera;

stopButton.onclick =
  stopCamera;

captureButton.onclick =
  captureMedal;


/*
  最初の表示
*/

renderCollection();

</script>

</body>
</html>
